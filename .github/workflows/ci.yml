name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt/WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-sync1 \
            libxcb-xfixes0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Core is Qt-free (hard invariant)
        run: python -m pytest tests/test_core_no_qt.py -v
      - name: Full test suite (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssnow_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ssnow_web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend bundle
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ssnow_web/package-lock.json
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Install frontend dependencies
        working-directory: ssnow_web
        run: npm ci
      - name: Build frontend bundle
        working-directory: ssnow_web
        run: npm run build
      - name: Playwright browser tests (system Chrome)
        working-directory: ssnow_web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ssnow_web/playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f packaging/Dockerfile.web -t ssnow-web:ci .
      - name: Run container and check health + seeded data
        run: |
          docker run -d --rm --name ssnow-ci -p 18300:8123 ssnow-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18300/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:18300/api/health
          curl -fsS "http://localhost:18300/api/events?limit=1" | grep -q '"count"'
          docker stop ssnow-ci
      - name: Image must not bundle the desktop toolkit
        run: |
          if docker run --rm ssnow-web:ci python -c "import PySide6" 2>/dev/null; then
            echo "PySide6 must not be installed in the web image" >&2; exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt/WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-sync1 \
            libxcb-xfixes0
      - name: Install dependencies (bundles PySide6 from wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Build AppImage
        run: sh packaging/build_appimage.sh
      - name: Smoke-test the AppImage (offscreen boot)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          timeout 45 packaging/Solar_System_Now-x86_64.AppImage --help || test $? -eq 124
      - name: Checksums + GPG signature (signed when the key secret is present)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.SSNOW_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.SSNOW_GPG_KEY_ID }}
        run: |
          cd packaging
          sha256sum Solar_System_Now-x86_64.AppImage > SHA256SUMS
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::No SSNOW_GPG_PRIVATE_KEY secret; shipping unsigned checksums only"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign \
            --local-user "$GPG_KEY_ID" -o SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Solar_System_Now-x86_64.AppImage
          path: packaging/Solar_System_Now-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            packaging/SHA256SUMS
            packaging/SHA256SUMS.asc
          if-no-files-found: warn
