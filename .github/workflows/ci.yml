name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt/WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-sync1 \
            libxcb-xfixes0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Core is Qt-free (hard invariant)
        run: python -m pytest tests/test_core_no_qt.py -v
      - name: Full test suite (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssnow_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ssnow_web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend bundle
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ssnow_web/package-lock.json
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Install frontend dependencies
        working-directory: ssnow_web
        run: npm ci
      - name: Build frontend bundle
        working-directory: ssnow_web
        run: npm run build
      - name: Playwright smoke tests (system Chrome)
        working-directory: ssnow_web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ssnow_web/playwright-report/
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt/WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-sync1 \
            libxcb-xfixes0
      - name: Install dependencies (bundles PySide6 from wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Build AppImage
        run: sh packaging/build_appimage.sh
      - name: Smoke-test the AppImage (offscreen boot)
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          timeout 45 packaging/Solar_System_Now-x86_64.AppImage --help || test $? -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: Solar_System_Now-x86_64.AppImage
          path: packaging/Solar_System_Now-x86_64.AppImage
          if-no-files-found: error
