name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Core is Qt-free (hard invariant)
        run: python -m pytest tests/test_core_no_qt.py -v
      - name: Full test suite (offscreen GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ssnow_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ssnow_web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend bundle
        run: npm run build
