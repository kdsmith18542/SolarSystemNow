[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssnow"
version = "0.1.3"
description = "Linux desktop real-data platform for Earth weather, natural hazards, space weather, Sun and Moon"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Solar System Now" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "skyfield>=1.49",
    "numpy",
    "platformdirs",
]

[project.scripts]
ssnow = "ssnow_core.cli:main"
ssnow-web = "ssnow_web.server:main"

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "respx>=0.23", "PySide6>=6.7"]
web = ["fastapi>=0.110", "uvicorn>=0.30", "python-multipart>=0.0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ssnow_core*", "ssnow_desktop*", "ssnow_web*", "scripts*"]

[tool.setuptools.package-data]
"ssnow_core" = ["data/seed/*", "data/de421.bsp", "data/maplibre/*", "data/geo/*"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]
